- job:
    name: treasuremap-aircat-kubeadm-day2-1node
    description: |
      Build a single node Kubernetes cluster on a bare node using the day 0
      kubeadm chart (airship/promenade charts/kubeadm) rendered with the
      aircat site config. All Kubernetes PKI is generated by Pegleg and
      delivered by the chart bootstrap script. Then the cluster is handed
      over to Armada (armada-operator): Calico (Tigera operator) and the
      same kubeadm chart are deployed (day 2), the anchor daemonset takes
      over the node configuration. Check that a configuration change of the
      control plane is applied by the anchor without evicting workloads.
    nodeset: treasuremap-aircat-1node-ubuntu_noble
    voting: true
    timeout: 5400
    roles:
      - zuul: openstack/openstack-helm
      - zuul: zuul/zuul-jobs
    required-projects:
      - openstack/openstack-helm
      - airship/promenade
      - airship/armada-operator
    irrelevant-files:
      - ^.*\.rst$
      - ^doc/.*$
      - ^releasenotes/.*$
      - ^site/seaworthy/.*$
      - ^site/seaworthy-virt/.*$
      - ^site/airskiff/.*$
      - ^site/airskiff-suse/.*$
      - ^site/airsloop/.*$
      - ^site/aiab/.*$
      - ^site/aircruiser/.*$
      - ^tools/deployment/airskiff/.*$
    pre-run:
      - tools/gate/playbooks/prepare-hosts.yaml
      - tools/gate/playbooks/mount-volumes.yaml
      - tools/gate/playbooks/aircat-deploy-env.yaml
      - tools/gate/playbooks/git-config.yaml
    run:
      - tools/gate/playbooks/airship-run-scripts.yaml
    post-run:
      - tools/gate/playbooks/osh-infra-collect-logs.yaml
    vars:
      site: aircat
      helm_version: "4.1.1"
      # Images and containers on the extra volume of the node (mount-volumes):
      # the genesis node runs all of them, the root disk is too small
      docker:
        root_path: "/opt/ext_vol/docker"
      containerd:
        root_path: "/opt/ext_vol/containerd"
      # promenade ref the kubeadm chart is taken from; jobs of airship/promenade
      # inheriting this one set it to "" to test the promenade change itself
      promenade_ref: master
      # Artifact repository of the site: charts and images served by static
      # pods of the first control plane node (050-armada-apply.sh)
      artifacts_host: artifacts.airship.internal
      artifacts_ip: 172.24.255.10
      insecure_registries: artifacts.airship.internal:5000
      # Images built from the checkouts of their projects and deployed instead
      # of the published ones (e.g. "armada-go armada-operator"), set by the
      # jobs of these projects
      build_images: ""
      gate_scripts_relative_path: .
      gate_scripts:
        - ./tools/deployment/aircat/005-checkout-promenade-ref.sh {{ promenade_ref }}
        - ./tools/deployment/aircat/010-generate-secrets.sh
        - BUILD_IMAGES="{{ build_images }}" ./tools/deployment/aircat/020-render-site.sh
        - ./tools/deployment/aircat/030-install-k8s-binaries.sh
        - ./tools/deployment/aircat/040-kubeadm-bootstrap.sh
        - ./tools/deployment/aircat/050-armada-apply.sh
        - ./tools/deployment/aircat/060-smoke-test.sh
        - ./tools/deployment/aircat/080-kubeadm-day2-reconfigure.sh no-eviction
        - ./tools/deployment/aircat/060-smoke-test.sh

- job:
    name: treasuremap-aircruiser-kubeadm-5nodes
    parent: treasuremap-aircat-kubeadm-day2-1node
    nodeset: treasuremap-aircat-5nodes-ubuntu_noble
    description: |
      Build a 5 node Kubernetes cluster (3 control plane nodes with stacked
      etcd, 2 workers) on bare nodes using the day 0 kubeadm chart rendered
      with the aircruiser site config (full PKI generated by Pegleg): the first
      control plane node runs kubeadm init, the rest join the cluster,
      workers join with kubelet credentials delivered by the chart. Every
      node runs haproxy (VIP) for the control plane endpoint. The genesis
      node is bootstrapped first, the bootstrap Armada (its static pods)
      deploys the genesis: Calico (Tigera operator), the same kubeadm chart
      (the anchor daemonsets take over the node configuration), Ceph (Rook)
      and the Airship components (Keystone, Deckhand, Armada). The cluster
      is handed over to the deployed Armada and the documents are uploaded
      to Deckhand, then the rest of the nodes join the cluster and the full
      site is applied with the Armada API: the cluster configuration and
      Ceph are scaled out to the nodes. The day 2 changes are applied the
      same way. Day 2 scenarios: certificate rotation (a
      new set of certificates issued by the same CAs) and the Kubernetes
      upgrade (v1.36 -> v1.37).
    timeout: 10800
    irrelevant-files:
      - ^.*\.rst$
      - ^doc/.*$
      - ^releasenotes/.*$
      - ^site/seaworthy/.*$
      - ^site/seaworthy-virt/.*$
      - ^site/airskiff/.*$
      - ^site/airskiff-suse/.*$
      - ^site/airsloop/.*$
      - ^site/aiab/.*$
      - ^site/aircat/.*$
      - ^tools/deployment/airskiff/.*$
    required-projects:
      - airship/armada
      - airship/deckhand
    pre-run:
      - tools/gate/playbooks/aircat-ceph-disks.yaml
    run:
      - tools/gate/playbooks/aircat-multinode-deploy.yaml
      - tools/gate/playbooks/airship-run-scripts.yaml
    vars:
      site: aircruiser
      # Node IPs of the aircruiser site on the vxlan overlay network. The
      # primary node must be the first control plane node of the site.
      overlay_network_setup: true
      aircruiser_node_ips:
        primary: 10.248.0.11
        node-1: 10.248.0.12
        node-2: 10.248.0.13
        node-3: 10.248.0.21
        node-4: 10.248.0.22
      overlay_network_bridge_ip: "{{ aircruiser_node_ips[inventory_hostname] }}"
      artifacts_ip: "{{ aircruiser_node_ips.primary }}"
      # Ceph OSD disks: loop devices of the control plane nodes backed by
      # images on the extra volume of the node (mount-extra-volume)
      loopback_hosts: primary:node-1:node-2
      loopback_device: /dev/loop100
      loopback_image: /opt/ext_vol/ceph/osd.img
      loopback_image_size: 20G
      # The cluster is built by aircat-multinode-deploy.yaml: the genesis
      # node is bootstrapped, the genesis scripts deploy the genesis, then
      # the rest of the nodes join the cluster and the gate scripts deploy
      # the full site. They run on the primary (genesis) node.
      genesis_scripts:
        - ./tools/deployment/aircat/050-armada-apply.sh
        - ./tools/deployment/aircat/060-smoke-test.sh
        - ./tools/deployment/aircat/054-armada-handover.sh
      gate_scripts:
        - ./tools/deployment/aircat/056-armada-full-site.sh
        - ./tools/deployment/aircat/060-smoke-test.sh
        - ./tools/deployment/aircat/070-kubeadm-rotate-certs.sh
        - ./tools/deployment/aircat/060-smoke-test.sh
        - ./tools/deployment/aircat/090-kubeadm-upgrade.sh
        - ./tools/deployment/aircat/060-smoke-test.sh

