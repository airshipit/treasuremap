- project:
    templates:
      - docs-on-readthedocs
    vars:
      rtd_project_name: 'airship-treasuremap'
      rtd_webhook_id: '47687'
    check:
      jobs:
        - treasuremap-seaworthy-site-lint
        - treasuremap-seaworthy-virt-site-lint
        - treasuremap-airskiff-ubuntu-site-lint
        - treasuremap-airskiff-suse-site-lint
        - treasuremap-airsloop-site-lint
        - treasuremap-aiab-site-lint
        - treasuremap-aircat-site-lint
        - treasuremap-aircat-kubeadm-day2-1node
        - treasuremap-aircruiser-site-lint
        - treasuremap-aircruiser-kubeadm-5nodes
        # TODO
        # update OSH charts vaoues in manifests and add more
        # charts to full-site manifests
        # - treasuremap-airskiff-multinode-full-site
        # 1node airskiff jobs disabled becase of frequent overload issues
        # - treasuremap-airskiff-1node-reduced-site
        # - treasuremap-airskiff-1node-reduced-site-armada-operator
        # - treasuremap-airskiff-5nodes-reduced-site
        - treasuremap-airskiff-5nodes-reduced-site-armada-operator
        # - maas-airskiff-deployment-noble-kubeadm-maas-upgrade
    gate:
      jobs:
        - treasuremap-seaworthy-site-lint
        - treasuremap-seaworthy-virt-site-lint
        - treasuremap-airskiff-ubuntu-site-lint
        - treasuremap-airskiff-suse-site-lint
        - treasuremap-airsloop-site-lint
        - treasuremap-aiab-site-lint
        - treasuremap-aircat-site-lint
        - treasuremap-aircruiser-site-lint
    post:
      jobs:
        - treasuremap-upload-git-mirror
    promote:
      jobs:
        - promote-airship-project-docs:
            files:
              - ^doc/.*$

