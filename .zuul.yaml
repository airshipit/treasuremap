- job:
    name: airship-docker-build-gate-base
    abstract: true
    timeout: 3600
    run: tools/gate/playbooks/airship-docker-image-build.yaml


- job:
    name: airship-chart-build-base
    abstract: true
    timeout: 3600
    run: ./tools/gate/playbooks/build-charts.yaml

- job:
    name: treasuremap-airskiff-infra-deploy-base
    abstract: true
    roles:
      - zuul: openstack/openstack-helm
      - zuul: zuul/zuul-jobs
    required-projects:
      - openstack/openstack-helm
      - openstack/openstack-helm-plugin
    irrelevant-files:
      - ^.*\.rst$
      - ^doc/.*$
      - ^releasenotes/.*$
      - ^site/seaworthy/.*$
      - ^site/airsloop/.*$
      - ^site/aiab/.*$
    timeout: 10800
    pre-run:
      - tools/gate/playbooks/checkout-treasuremap-ref.yaml
      - tools/gate/playbooks/prepare-hosts.yaml
      - tools/gate/playbooks/mount-volumes.yaml
      - tools/gate/playbooks/deploy-env.yaml
      - tools/gate/playbooks/git-config.yaml
    run:
      - tools/gate/playbooks/airship-run-scripts.yaml
    post-run:
      - tools/gate/playbooks/osh-infra-collect-logs.yaml
    vars:
      docker:
        root_path: "/opt/ext_vol/docker"
      containerd:
        root_path: "/opt/ext_vol/containerd"
      loopback_setup: true
      loopback_device: /dev/loop100
      loopback_image: "/opt/ext_vol/openstack-helm/ceph-loop.img"
      ceph_osd_data_device: /dev/loop100
      floating_network_setup: false
      site: airskiff
      helm_version: "4.1.1"
      HELM_ARTIFACT_URL: https://get.helm.sh/helm-v4.1.1-linux-amd64.tar.gz
      HTK_COMMIT: d89bc42b57f8c2898520181550b5019dcf31c06f
      OSH_COMMIT: d89bc42b57f8c2898520181550b5019dcf31c06f
      USE_ARMADA_GO: false
      ENABLE_SLEEP: false
      overlay_network_setup: true
      metallb_setup: true
      gatewayapi_setup: true
      coredns_resolver_setup: true
      dnsmasq_extra_args: "--server=/minikube.internal/10.96.0.10 --server=/cluster.local/10.96.0.10 --server=/svc.cluster.local/10.96.0.10"
      DOCKER_REGISTRY: "control-plane.minikube.internal:5000"
      openstack_provider_gateway_setup: false
      osh_plugin_repo: "{{ zuul.project.src_dir }}/../../openstack/openstack-helm-plugin"
      osh_values_overrides_path: "{{ zuul.project.src_dir }}/../../openstack/openstack-helm/values_overrides"
      gate_scripts_relative_path: .
      gate_scripts:
        - ./tools/deployment/airskiff/developer/000-prepare-k8s.sh
        - ./tools/deployment/airskiff/developer/009-setup-apparmor.sh
        - ./tools/deployment/airskiff/developer/000-clone-dependencies.sh
        - ./tools/deployment/airskiff/developer/020-setup-client.sh
        - ./tools/deployment/airskiff/developer/015-make-all-charts.sh
        - ./tools/deployment/airskiff/developer/017-make-all-images.sh
        - ./tools/deployment/airskiff/developer/022-generate_security_keys.sh
        - ./tools/deployment/airskiff/developer/025-start-artifactory.sh
        - ./tools/deployment/airskiff/developer/026-reduce-site.sh
        - ./tools/deployment/airskiff/developer/027-enable-armada-operator.sh
        - ./tools/deployment/airskiff/common/sleep.sh
        - ./tools/deployment/airskiff/developer/030-armada-bootstrap.sh
        - ./tools/deployment/airskiff/developer/050-expose-airflow-ui.sh
        - ./tools/deployment/airskiff/developer/100-deploy-osh.sh
        - ./tools/deployment/airskiff/common/os-env.sh
        - ./tools/gate/wait-for-shipyard.sh
        - ./tools/deployment/airskiff/common/get-airflow-worker-logs.sh

- job:
    name: treasuremap-airskiff-multinode-full-site
    parent: treasuremap-airskiff-infra-deploy-base
    nodeset: treasuremap-airskiff-5nodes-ubuntu_noble
    description: |
      Deploy Openstack using Airskiff and latest Treasuremap changes.
      Airskiff is using latest Airship v1.x based on Airflow-3.1.5
    voting: true
    vars:
      overlay_network_setup: true

