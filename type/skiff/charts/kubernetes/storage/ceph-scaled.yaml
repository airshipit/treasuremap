---
# The genesis Ceph scaled out (the same release): mons, mgrs and OSDs on
# all the nodes labeled ceph-mon=enabled and ceph-osd=enabled, the pools
# keep 3 replicas on different nodes, so a node can be drained.
schema: armada/Chart/v1
metadata:
  schema: metadata/Document/v1
  name: kubeadm-rook-ceph-cluster-scaled
  layeringDefinition:
    abstract: false
    layer: type
    parentSelector:
      name: kubeadm-rook-ceph-cluster-global
    actions:
      - method: merge
        path: .
      - method: replace
        path: .values.cephBlockPools
  storagePolicy: cleartext
data:
  values:
    cephClusterSpec:
      mon:
        count: 3
      mgr:
        count: 2
    cephBlockPools:
      - name: builtin-mgr
        namespace: ceph
        spec:
          name: .mgr
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: false
      - name: rbd
        namespace: ceph
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: general
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          mountOptions: []
          allowedTopologies: []
          parameters:
            imageFormat: "2"
            imageFeatures: layering
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: ceph
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: ceph
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: ceph
            csi.storage.k8s.io/fstype: ext4
---
schema: armada/ChartGroup/v1
metadata:
  schema: metadata/Document/v1
  name: kubeadm-storage-scaled
  layeringDefinition:
    abstract: false
    layer: type
  storagePolicy: cleartext
data:
  description: Ceph (Rook) scaled out
  sequenced: true
  chart_group:
    - kubeadm-rook-ceph
    - kubeadm-ceph-csi-drivers
    - kubeadm-rook-ceph-cluster-scaled
    - kubeadm-ceph-ready
...
