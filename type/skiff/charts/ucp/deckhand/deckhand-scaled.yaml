---
# Barbican scaled out (the same release as ucp-barbican)
schema: armada/Chart/v1
metadata:
  schema: metadata/Document/v1
  name: ucp-barbican-scaled
  layeringDefinition:
    abstract: false
    layer: type
    parentSelector:
      name: ucp-barbican-global
    actions:
      - method: merge
        path: .
  storagePolicy: cleartext
data:
  values:
    pod:
      replicas:
        api: 2
---
# Deckhand scaled out (the same release as ucp-deckhand)
schema: armada/Chart/v1
metadata:
  schema: metadata/Document/v1
  name: ucp-deckhand-scaled
  layeringDefinition:
    abstract: false
    layer: type
    parentSelector:
      name: ucp-deckhand-global
    actions:
      - method: merge
        path: .
  storagePolicy: cleartext
data:
  wait:
    timeout: 1800
  values:
    pod:
      replicas:
        deckhand: 2
---
schema: armada/ChartGroup/v1
metadata:
  schema: metadata/Document/v1
  name: ucp-deckhand-scaled
  layeringDefinition:
    abstract: false
    layer: type
  storagePolicy: cleartext
data:
  description: Deckhand scaled out
  sequenced: true
  chart_group:
    - ucp-barbican-scaled
    - ucp-deckhand-scaled
...
