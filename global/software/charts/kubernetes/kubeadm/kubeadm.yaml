---
# Kubeadm chart (airship/promenade charts/kubeadm) of a multinode site with
# stacked etcd: the configuration of the cluster which isn't specific to the
# site. The sites define the nodes and the certificates (the site documents
# are children of this one):
#   kubeadm        - the genesis: the genesis node (the first control plane
#                    node, kubeadm init) only
#   kubeadm-scaled - the same release with all nodes of the site, deployed
#                    by the full site
#
# The chart is used in "full PKI" mode: all certificates and keys are
# generated by Pegleg and delivered by the bootstrap script, so kubeadm skips
# its certs and kubeconfig phases. Every node runs haproxy (static pod) which
# serves the control plane endpoint 127.0.0.1:6553 balancing the apiservers
# of the control plane nodes (values.nodes).
schema: armada/Chart/v1
metadata:
  schema: metadata/Document/v1
  name: kubeadm-global
  labels:
    name: kubeadm-global
  layeringDefinition:
    abstract: true
    layer: global
  storagePolicy: cleartext
data:
  chart_name: kubeadm
  release: kubeadm
  namespace: kube-system
  # The release is ready when the anchor has applied the configuration on
  # every node (anchor pods become ready after that)
  wait:
    timeout: 3600
    labels:
      release_group: airship-kubeadm
  upgrade:
    no_hooks: false
  dependencies: []
  values:
    kubelet:
      # The anchor applies kubelet configuration changes: it drains the node
      # and restarts kubelet (there are other nodes for the workloads)
      restart: true
      # used by the kubelet configuration below, changed by the gate to check
      # that the anchor applies kubelet configuration changes
      containerLogMaxFiles: 2

    kubeconfig:
      clusterName: kubernetes
      # haproxy (VIP) on every node balancing apiservers of control plane nodes
      controlPlaneEndpoint: 127.0.0.1:6553
      # controller-manager and scheduler talk to the local apiserver
      controlPlaneLocalEndpoint: 127.0.0.1:6443

    vip:
      # haproxy frontend and backends: "<bind>|<apiserver>,<apiserver>,..."
      init: >-
        *:6553|{{- $backends := list -}}
        {{- range .Values.nodes -}}
        {{- if eq .role "control-plane" -}}
        {{- $backends = append $backends (printf "%s:6443" .ip) -}}
        {{- end -}}
        {{- end -}}
        {{- join "," $backends -}}

    kubeadm:
      fs:
        "ClusterConfiguration": "templates/phases/snippets/kubeadm/ClusterConfiguration"
        "init_config.yaml": "templates/phases/snippets/kubeadm/init_config.yaml"
        "join_config.yaml": "templates/phases/snippets/kubeadm/join_config.yaml"
        # used by the anchor (day 2): kubeadm upgrade node
        "upgrade_config.yaml": "templates/phases/snippets/kubeadm/upgrade_config.yaml"

    bundle:
      tpl:
        # Anchor pods are used to run commands on the hosts (chroot /host),
        # see host_exec in ./tools/deployment/airliner/common.sh
        "templates/_daemonset-masters.yaml.patch": |
          spec:
            template:
              metadata:
                labels:
                  hostfs: "true"
              spec:
                hostIPC: true
                hostNetwork: true
                hostPID: true
        "templates/_daemonset-workers.yaml.patch": |
          spec:
            template:
              metadata:
                labels:
                  hostfs: "true"
              spec:
                hostIPC: true
                hostNetwork: true
                hostPID: true
        "templates/phases/snippets/kubeadm/ClusterConfiguration": |
          apiVersion: kubeadm.k8s.io/v1beta4
          kind: ClusterConfiguration
          kubernetesVersion: {{ .Values.cluster_config.kubernetesVersion }}
          clusterName: {{ .Values.kubeconfig.clusterName }}
          controlPlaneEndpoint: {{ .Values.kubeconfig.controlPlaneEndpoint }}
          certificatesDir: /etc/kubernetes/pki
          imageRepository: registry.k8s.io
          encryptionAlgorithm: RSA-2048
          networking:
            dnsDomain: {{ .Values.network.dns.cluster_domain }}
            podSubnet: {{ .Values.network.kubernetes.pod_cidr }}
            serviceSubnet: {{ .Values.network.kubernetes.service_cidr }}
          apiServer:
            extraArgs:
              - name: service-node-port-range
                value: {{ .Values.network.kubernetes.service_node_port_range | quote }}
              - name: tls-min-version
                value: VersionTLS12
          controllerManager:
            extraArgs:
              - name: terminated-pod-gc-threshold
                value: "1000"
          scheduler:
            # scheduler.conf delivered by the chart references the client
            # certificate in /etc/kubernetes/pki
            extraVolumes:
              - name: pki-certs
                hostPath: /etc/kubernetes/pki
                mountPath: /etc/kubernetes/pki
                readOnly: true
                pathType: Directory
          etcd:
            local:
              dataDir: /var/lib/etcd
              extraArgs:
                # peer certificates are issued by a dedicated CA
                - name: peer-trusted-ca-file
                  value: /etc/kubernetes/pki/etcd/ca-peer.crt
        "templates/phases/snippets/kubeadm/init_config.yaml": |
          apiVersion: kubeadm.k8s.io/v1beta4
          kind: InitConfiguration
          localAPIEndpoint:
            advertiseAddress: "${NODE_IP}"
            bindPort: 6443
          nodeRegistration:
            name: "${NODE_NAME}"
            criSocket: unix:///run/containerd/containerd.sock
            imagePullPolicy: IfNotPresent
            # anchor daemonsets don't tolerate the control plane taint
            taints: []
            ignorePreflightErrors:
              # kubelet is started by the bootstrap script before kubeadm
              - Port-10250
              # the bootstrap script delivers static pods and kubeconfigs
              - DirAvailable--etc-kubernetes-manifests
              - FileAvailable--etc-kubernetes-kubelet.conf
          skipPhases:
            # certificates and kubeconfigs are delivered by the bootstrap script
            - certs
            - kubeconfig
            # kubelet configuration is delivered and kubelet is (re)started
            # by the bootstrap script
            - kubelet-start
            - kubelet-finalize
          timeouts:
            controlPlaneComponentHealthCheck: 5m0s
            kubeletHealthCheck: 5m0s
            # wait-control-plane starts with bootstrapping the admin client
            # which polls the apiserver before waiting for the control plane
            kubernetesAPICall: 3m0s
        "templates/phases/snippets/kubeadm/join_config.yaml": |
          apiVersion: kubeadm.k8s.io/v1beta4
          kind: JoinConfiguration
          caCertPath: /etc/kubernetes/pki/ca.crt
          controlPlane:
            localAPIEndpoint:
              advertiseAddress: "${NODE_IP}"
              bindPort: 6443
          discovery:
            # delivered by the bootstrap script on control plane nodes
            file:
              kubeConfigPath: /etc/kubernetes/admin.conf
          nodeRegistration:
            name: "${NODE_NAME}"
            criSocket: unix:///run/containerd/containerd.sock
            imagePullPolicy: IfNotPresent
            # anchor daemonsets don't tolerate the control plane taint
            taints: []
          skipPhases:
            # the bootstrap script delivers kubeconfigs and starts kubelet,
            # preflight would fail on them
            - preflight
            # certificates and kubeconfigs are delivered by the bootstrap script
            - control-plane-prepare/download-certs
            - control-plane-prepare/certs
            - control-plane-prepare/kubeconfig
            # kubelet configuration is delivered and kubelet is (re)started
            # by the bootstrap script
            - kubelet-start
          timeouts:
            controlPlaneComponentHealthCheck: 5m0s
            kubeletHealthCheck: 5m0s
            kubernetesAPICall: 3m0s
            discovery: 5m0s
        "templates/phases/snippets/kubeadm/upgrade_config.yaml": |
          apiVersion: kubeadm.k8s.io/v1beta4
          kind: UpgradeConfiguration
          node:
            # PKI is generated for the site and delivered by the chart
            certificateRenewal: false
            etcdUpgrade: true
            imagePullPolicy: IfNotPresent
            ignorePreflightErrors:
              - SystemVerification
              - CoreDNSUnsupportedPlugins
              - CoreDNSMigration
            skipPhases:
              # kubelet configuration is delivered by the chart
              - kubelet-config
            # addons (CoreDNS, kube-proxy) installed by kubeadm init are
            # upgraded by the addon phase on the last upgraded control plane
            # node
          # Must match the init configuration: static pod startup probes are
          # derived from controlPlaneComponentHealthCheck, a different value
          # changes the manifests and restarts the control plane.
          timeouts:
            controlPlaneComponentHealthCheck: 5m0s
            kubeletHealthCheck: 5m0s
            kubernetesAPICall: 3m0s
        "templates/phases/snippets/kubelet/_kubelet-config.yaml": |
          apiVersion: kubelet.config.k8s.io/v1beta1
          kind: KubeletConfiguration
          authentication:
            anonymous:
              enabled: false
            webhook:
              enabled: true
            x509:
              clientCAFile: /etc/kubernetes/pki/kubelet-client-ca.pem
          authorization:
            mode: Webhook
          cgroupDriver: systemd
          clusterDNS:
            - {{ .Values.network.dns.service_ip }}
          clusterDomain: {{ .Values.network.dns.cluster_domain }}
          containerRuntimeEndpoint: unix:///run/containerd/containerd.sock
          staticPodPath: /etc/kubernetes/manifests
          tlsCertFile: /etc/kubernetes/pki/kubelet.pem
          tlsPrivateKeyFile: /etc/kubernetes/pki/kubelet-key.pem
          rotateCertificates: false
          readOnlyPort: 0
          containerLogMaxFiles: {{ .Values.kubelet.containerLogMaxFiles }}
...
