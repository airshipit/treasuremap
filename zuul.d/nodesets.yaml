- nodeset:
    name: airship-treasuremap-full-4-nodes-jammy-cluster
    nodes:
      - name: primary
        label: ubuntu-jammy-32GB
      - name: compute-1
        label: ubuntu-jammy
      - name: compute-2
        label: ubuntu-jammy
      - name: compute-3
        label: ubuntu-jammy
    groups:
      - name: compute
        nodes:
          - compute-1
          - compute-2
          - compute-3
- nodeset:
    name: airship-treasuremap-single-16GB-jammy-node
    nodes:
      - name: primary
        label: ubuntu-jammy
- nodeset:
    name: airship-treasuremap-single-32GB-jammy-node
    nodes:
      - name: primary
        label: ubuntu-jammy-32GB
