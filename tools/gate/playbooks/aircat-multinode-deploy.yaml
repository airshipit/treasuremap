# Deployment of a multinode site with the kubeadm chart. Site documents are
# rendered on the primary node (it must be the genesis node: the first
# control plane node of the site) and distributed to the rest of the nodes,
# then:
#   1. the genesis node: kubeadm init (the genesis kubeadm chart document)
#   2. the genesis scripts on the genesis node (genesis_scripts job
#      variable): the bootstrap Armada deploys the genesis of the site, the
#      cluster is handed over to the Armada of the site, the documents of
#      the site are uploaded to Deckhand
#   3. the rest of control plane nodes one by one: kubeadm join (etcd members
#      are added one at a time) with the scaled kubeadm chart document
#   4. workers: kubelet joins with the delivered credentials
# The full site is deployed by the gate scripts then.
# Everything runs in the treasuremap checkout: jobs of other projects
# inheriting the treasuremap jobs set zuul_treasuremap_relative_path.
---
- hosts: all
  any_errors_fatal: true
  tasks:
    - name: Check out promenade ref
      shell: |
        set -xe;
        ./tools/deployment/aircat/005-checkout-promenade-ref.sh {{ promenade_ref | default('') }}
      args:
        chdir: "{{ zuul.project.src_dir }}/{{ zuul_treasuremap_relative_path | default('') }}"

- hosts: primary
  any_errors_fatal: true
  environment:
    PL_SITE: "{{ site }}"
    BUILD_IMAGES: "{{ build_images | default('') }}"
  tasks:
    - name: Generate secrets and render site documents
      shell: |
        set -xe;
        ./tools/deployment/aircat/010-generate-secrets.sh
        ./tools/deployment/aircat/020-render-site.sh
      args:
        chdir: "{{ zuul.project.src_dir }}/{{ zuul_treasuremap_relative_path | default('') }}"

    # Rendered documents contain private keys: they are passed through the
    # executor work directory, not the logs.
    - name: Fetch rendered site documents
      fetch:
        src: "{{ zuul.project.src_dir }}/{{ zuul_treasuremap_relative_path | default('') }}/{{ site }}.yaml"
        dest: "{{ zuul.executor.work_root }}/{{ site }}.yaml"
        flat: true

- hosts: all:!primary
  any_errors_fatal: true
  tasks:
    - name: Distribute rendered site documents
      copy:
        src: "{{ zuul.executor.work_root }}/{{ site }}.yaml"
        dest: "{{ zuul.project.src_dir }}/{{ zuul_treasuremap_relative_path | default('') }}/{{ site }}.yaml"
        mode: "0600"

- hosts: all
  any_errors_fatal: true
  environment:
    PL_SITE: "{{ site }}"
  tasks:
    - name: Install Kubernetes binaries
      shell: |
        set -xe;
        ./tools/deployment/aircat/030-install-k8s-binaries.sh
      args:
        chdir: "{{ zuul.project.src_dir }}/{{ zuul_treasuremap_relative_path | default('') }}"

    - name: Bootstrap the first control plane node
      shell: |
        set -xe;
        ./tools/deployment/aircat/040-kubeadm-bootstrap.sh init
      args:
        chdir: "{{ zuul.project.src_dir }}/{{ zuul_treasuremap_relative_path | default('') }}"

- hosts: primary
  any_errors_fatal: true
  tasks:
    - name: Run genesis scripts
      include_role:
        name: "{{ ([item] | flatten | length == 1) | ternary('airship-run-script', 'airship-run-script-set') }}"
      vars:
        workload: "{{ [item] | flatten }}"
      loop: "{{ genesis_scripts | default([]) }}"

- hosts: all
  serial: 1
  any_errors_fatal: true
  environment:
    PL_SITE: "{{ site }}"
  tasks:
    - name: Join the rest of control plane nodes
      shell: |
        set -xe;
        ./tools/deployment/aircat/040-kubeadm-bootstrap.sh control-plane
      args:
        chdir: "{{ zuul.project.src_dir }}/{{ zuul_treasuremap_relative_path | default('') }}"

- hosts: all
  any_errors_fatal: true
  environment:
    PL_SITE: "{{ site }}"
  tasks:
    - name: Join workers
      shell: |
        set -xe;
        ./tools/deployment/aircat/040-kubeadm-bootstrap.sh worker
      args:
        chdir: "{{ zuul.project.src_dir }}/{{ zuul_treasuremap_relative_path | default('') }}"
...
