# Prepare a bare node for the kubeadm chart based (day 0) deployment.
# Unlike deploy-env.yaml, Kubernetes is NOT deployed here: only the parts
# of the openstack-helm deploy-env role which the bootstrap script expects
# to be present on the node are used (packages, containerd, docker for
# Pegleg) and the cluster is built by tools/deployment/aircat scripts.
---
- hosts: all
  become: true
  gather_facts: true

  roles:
    - ensure-python
    - ensure-pip
    - clear-firewall
    # the Airship charts run their containers with the runtime/default
    # AppArmor profile
    - deploy-apparmor

  tasks:
    - name: Install prerequisites
      include_role:
        name: deploy-env
        tasks_from: prerequisites.yaml

    - name: Deploy containerd and docker
      include_role:
        name: deploy-env
        tasks_from: containerd.yaml

    # Multinode sites: node IPs defined by the site are configured on a
    # vxlan overlay network (see overlay_network_bridge_ip job variable)
    - name: Overlay network
      include_role:
        name: deploy-env
        tasks_from: overlay.yaml
      when: overlay_network_setup | default(false) | bool

    # Charts and images of the site are served by its bootstrap: static pods
    # on the host network of the first control plane node (artifacts_ip), see
    # tools/deployment/aircat/050-armada-apply.sh. The host name stands for
    # the artifact repository of a real site.
    - name: Host name of the artifact repository
      lineinfile:
        path: /etc/hosts
        regexp: '\s{{ artifacts_host }}$'
        line: "{{ artifacts_ip }} {{ artifacts_host }}"
      when: artifacts_ip is defined

    - name: Image registry of the artifact repository for containerd (HTTP)
      file:
        path: "/etc/containerd/certs.d/{{ artifacts_host }}:5000"
        state: directory
        mode: "0755"
      when: artifacts_ip is defined

    - name: Image registry hosts.toml of the artifact repository
      copy:
        dest: "/etc/containerd/certs.d/{{ artifacts_host }}:5000/hosts.toml"
        content: |
          server = "http://{{ artifacts_host }}:5000"

          [host."http://{{ artifacts_host }}:5000"]
            capabilities = ["pull", "resolve", "push"]
            skip_verify = true
        mode: "0644"
      when: artifacts_ip is defined

    # used by the tools/deployment/aircat scripts on all nodes
    - name: Install python yaml module
      apt:
        name: python3-yaml
        state: present

    # Local resolvers (systemd-resolved, unbound) listen on the loopback
    # interface which is not reachable from CoreDNS pods.
    - name: Disable local DNS resolvers
      service:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop:
        - systemd-resolved
        - unbound
      failed_when: false

    - name: Configure resolv.conf
      copy:
        dest: /etc/resolv.conf
        content: |
          nameserver 8.8.8.8
        mode: "0644"
        follow: false

    - name: Install Packaging python module for tools/airship (Noble and up)
      pip:
        name: packaging
        executable: pip3
        extra_args: --break-system-packages
      when: ansible_distribution_release != "jammy"

    - name: Install Packaging python module for tools/airship (Jammy)
      pip:
        name: packaging
        executable: pip3
      when: ansible_distribution_release == "jammy"

- hosts: all
  roles:
    - ensure-helm
...
