---
- hosts: all
  roles:
    - start-zuul-console
    - role: add-authorized-keys
      public_keys:
        - public_key: ssh-rsa  sm@sm
  tasks:
    - name: Install k9s Kubernetes CLI tool
      block:
        - name: Download k9s package
          get_url:
            url: https://github.com/derailed/k9s/releases/download/v0.50.9/k9s_linux_amd64.deb
            dest: /tmp/k9s_linux_amd64.deb
            mode: '0644'
        - name: Install k9s package
          become: yes
          apt:
            deb: /tmp/k9s_linux_amd64.deb
            state: present

...
