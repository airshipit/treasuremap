# Day 0 of a multinode site: build the Kubernetes cluster with the kubeadm
# chart on all nodes. Site documents are rendered on the primary node (it must
# be the first control plane node of the site) and distributed to the rest of
# the nodes, then every node runs the bootstrap script phase by phase:
#   1. the first control plane node: kubeadm init
#   2. the rest of control plane nodes one by one: kubeadm join (etcd members
#      are added one at a time)
#   3. workers: kubelet joins with the delivered credentials
# Everything runs in the treasuremap checkout: jobs of other projects
# inheriting the treasuremap jobs set zuul_treasuremap_relative_path.
---
- hosts: all
  any_errors_fatal: true
  tasks:
    - name: Check out promenade ref
      shell: |
        set -xe;
        ./tools/deployment/airliner/005-checkout-promenade-ref.sh {{ promenade_ref | default('') }}
      args:
        chdir: "{{ zuul.project.src_dir }}/{{ zuul_treasuremap_relative_path | default('') }}"

- hosts: primary
  any_errors_fatal: true
  environment:
    PL_SITE: "{{ site }}"
  tasks:
    - name: Generate secrets and render site documents
      shell: |
        set -xe;
        ./tools/deployment/airliner/010-generate-secrets.sh
        ./tools/deployment/airliner/020-render-site.sh
      args:
        chdir: "{{ zuul.project.src_dir }}/{{ zuul_treasuremap_relative_path | default('') }}"

    # Rendered documents contain private keys: they are passed through the
    # executor work directory, not the logs.
    - name: Fetch rendered site documents
      fetch:
        src: "{{ zuul.project.src_dir }}/{{ zuul_treasuremap_relative_path | default('') }}/{{ site }}.yaml"
        dest: "{{ zuul.executor.work_root }}/{{ site }}.yaml"
        flat: true

- hosts: all:!primary
  any_errors_fatal: true
  tasks:
    - name: Distribute rendered site documents
      copy:
        src: "{{ zuul.executor.work_root }}/{{ site }}.yaml"
        dest: "{{ zuul.project.src_dir }}/{{ zuul_treasuremap_relative_path | default('') }}/{{ site }}.yaml"
        mode: "0600"

- hosts: all
  any_errors_fatal: true
  environment:
    PL_SITE: "{{ site }}"
  tasks:
    - name: Install Kubernetes binaries
      shell: |
        set -xe;
        ./tools/deployment/airliner/030-install-k8s-binaries.sh
      args:
        chdir: "{{ zuul.project.src_dir }}/{{ zuul_treasuremap_relative_path | default('') }}"

    - name: Bootstrap the first control plane node
      shell: |
        set -xe;
        ./tools/deployment/airliner/040-kubeadm-bootstrap.sh init
      args:
        chdir: "{{ zuul.project.src_dir }}/{{ zuul_treasuremap_relative_path | default('') }}"

- hosts: all
  serial: 1
  any_errors_fatal: true
  environment:
    PL_SITE: "{{ site }}"
  tasks:
    - name: Join the rest of control plane nodes
      shell: |
        set -xe;
        ./tools/deployment/airliner/040-kubeadm-bootstrap.sh control-plane
      args:
        chdir: "{{ zuul.project.src_dir }}/{{ zuul_treasuremap_relative_path | default('') }}"

- hosts: all
  any_errors_fatal: true
  environment:
    PL_SITE: "{{ site }}"
  tasks:
    - name: Join workers
      shell: |
        set -xe;
        ./tools/deployment/airliner/040-kubeadm-bootstrap.sh worker
      args:
        chdir: "{{ zuul.project.src_dir }}/{{ zuul_treasuremap_relative_path | default('') }}"
...
