# Disks of the Ceph (Rook) OSDs of a site: a loop device backed by an image
# on the extra volume of the node (mounted by mount-volumes.yaml) is created
# for the OSD. Only the nodes of the loopback_hosts group (job variable) get
# the OSD disk.
---
- hosts: "{{ loopback_hosts | default('all') }}"
  become: true
  tasks:
    - name: Loop device for the Ceph OSD
      include_role:
        name: deploy-env
        tasks_from: loopback_devices.yaml
...
