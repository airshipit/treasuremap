---
- hosts: all
  tasks:
    - name: Checkout treasuremap ref
      git:
        repo: https://review.opendev.org/airship/treasuremap
        dest: "{{ zuul.project.src_dir }}/{{ zuul_treasuremap_relative_path | default('') }}"
        refspec: "{{ treasuremap_ref }}"
        version: FETCH_HEAD
        clone: false
      when:
        - treasuremap_ref is defined
        - treasuremap_ref|length > 0
        - treasuremap_ref != "{{ zuul.projects['opendev.org/airship/treasuremap'].checkout }}"
