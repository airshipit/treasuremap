---
images:
  # waits for the custom resources (DEPENDENCY_CUSTOM_RESOURCE)
  entrypoint: quay.io/airshipit/kubernetes-entrypoint:latest-ubuntu_noble
  pull_policy: IfNotPresent

# The CephCluster (in the namespace of the release) and its block pools
cluster: ceph
pools:
  - rbd

# a job runs until the resources are ready
active_deadline_seconds: 3600
...
