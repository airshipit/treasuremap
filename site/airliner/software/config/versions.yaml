---
schema: pegleg/SoftwareVersions/v1
metadata:
  schema: metadata/Document/v1
  replacement: true
  name: software-versions
  labels:
    name: software-versions-airliner
  layeringDefinition:
    abstract: false
    layer: site
    parentSelector:
      name: software-versions-global
    actions:
      - method: merge
        path: .
  storagePolicy: cleartext
data:
  charts:
    kubernetes:
      # NOTE: on day 0 the chart is rendered from a local promenade checkout,
      # these locations are used by Armada on day 2 (charts of the promenade
      # checkout are served by ./tools/deployment/airliner/050-armada-apply.sh)
      kubeadm:
        location: http://control-plane.minikube.internal:8282/kubeadm.tgz
        subpath: kubeadm
        type: tar
      tigera_operator:
        location: http://control-plane.minikube.internal:8282/tigera-operator.tgz
        subpath: tigera-operator
        type: tar
  images:
    kubernetes:
      kubeadm:
        # kubeadm, kubelet and kubectl of the anchor image must be of the
        # Kubernetes version below: the anchor checks it and syncs them to
        # the nodes. Pinned to the image built with v1.37.0 binaries.
        anchor: quay.io/airshipit/porthole-kubeadm-utility:f059ba0f3e4cc9f33c0ce20c08f521519549e206-ubuntu_noble
        dep_check: quay.io/airshipit/kubernetes-entrypoint:latest-ubuntu_noble
        haproxy: docker.io/library/haproxy:2.9.7
        containerd_pause: registry.k8s.io/pause:3.10
      tigera_operator:
        tigera_operator: quay.io/tigera/operator:v1.36.5
        dep_check: quay.io/airshipit/kubernetes-entrypoint:latest-ubuntu_noble
  kubernetes:
    # Version of Kubernetes control plane and node binaries (kubeadm,
    # kubelet, kubectl) used to bootstrap the cluster. Must match the
    # binaries of the kubeadm anchor image.
    version: v1.37.0
...
