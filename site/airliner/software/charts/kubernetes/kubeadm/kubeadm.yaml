---
# Kubeadm chart (airship/promenade charts/kubeadm).
#
# On day 0 the values of this document are used to render the bootstrap
# script (kubeadm-service-bootstrap Secret) which builds the Kubernetes
# cluster on a bare node, see
#   ./tools/deployment/airliner/040-kubeadm-bootstrap.sh
# On day 2 the chart is deployed into the cluster by Armada (armada-operator)
# with the kubeadm-cluster manifest, the anchor daemonsets take over the
# node configuration, see
#   ./tools/deployment/airliner/050-armada-apply.sh
#
# The chart is used in "full PKI" mode: all certificates and keys are
# generated by Pegleg (see site/airliner/pki/pki-catalog.yaml) and delivered
# by the bootstrap script, so kubeadm skips its certs and kubeconfig phases.
schema: armada/Chart/v1
metadata:
  schema: metadata/Document/v1
  name: kubeadm
  labels:
    name: kubeadm-site
  layeringDefinition:
    abstract: false
    layer: site
  storagePolicy: cleartext
  substitutions:
    # Chart source
    - src:
        schema: pegleg/SoftwareVersions/v1
        name: software-versions
        path: .charts.kubernetes.kubeadm
      dest:
        path: .source

    # Images
    - src:
        schema: pegleg/SoftwareVersions/v1
        name: software-versions
        path: .images.kubernetes.kubeadm
      dest:
        path: .values.images.tags

    # Kubernetes version
    - src:
        schema: pegleg/SoftwareVersions/v1
        name: software-versions
        path: .kubernetes.version
      dest:
        path: .values.cluster_config.kubernetesVersion

    # Network
    - src:
        schema: pegleg/CommonAddresses/v1
        name: common-addresses
        path: .dns.cluster_domain
      dest:
        path: .values.network.dns.cluster_domain
    - src:
        schema: pegleg/CommonAddresses/v1
        name: common-addresses
        path: .dns.service_ip
      dest:
        path: .values.network.dns.service_ip
    - src:
        schema: pegleg/CommonAddresses/v1
        name: common-addresses
        path: .kubernetes.pod_cidr
      dest:
        path: .values.network.kubernetes.pod_cidr
    - src:
        schema: pegleg/CommonAddresses/v1
        name: common-addresses
        path: .kubernetes.service_cidr
      dest:
        path: .values.network.kubernetes.service_cidr
    - src:
        schema: pegleg/CommonAddresses/v1
        name: common-addresses
        path: .kubernetes.service_node_port_range
      dest:
        path: .values.network.kubernetes.service_node_port_range

    # Kubernetes CA
    - src:
        schema: deckhand/CertificateAuthority/v1
        name: kubeadm-kubernetes
        path: .
      dest:
        path: .values.certs.ca.crt
    - src:
        schema: deckhand/CertificateAuthorityKey/v1
        name: kubeadm-kubernetes
        path: .
      dest:
        path: .values.certs.ca.key

    # Kubernetes apiserver
    - src:
        schema: deckhand/Certificate/v1
        name: kubeadm-apiserver
        path: .
      dest:
        path: .values.certs.apiserver.crt
    - src:
        schema: deckhand/CertificateKey/v1
        name: kubeadm-apiserver
        path: .
      dest:
        path: .values.certs.apiserver.key
    - src:
        schema: deckhand/Certificate/v1
        name: kubeadm-apiserver-kubelet-client
        path: .
      dest:
        path: .values.certs.apiserver_kubelet_client.crt
    - src:
        schema: deckhand/CertificateKey/v1
        name: kubeadm-apiserver-kubelet-client
        path: .
      dest:
        path: .values.certs.apiserver_kubelet_client.key
    - src:
        schema: deckhand/Certificate/v1
        name: kubeadm-apiserver-etcd
        path: .
      dest:
        path: .values.certs.apiserver_etcd_client.crt
    - src:
        schema: deckhand/CertificateKey/v1
        name: kubeadm-apiserver-etcd
        path: .
      dest:
        path: .values.certs.apiserver_etcd_client.key

    # Kubernetes controller-manager and scheduler
    - src:
        schema: deckhand/Certificate/v1
        name: kubeadm-controller-manager
        path: .
      dest:
        path: .values.certs.controller_manager.crt
    - src:
        schema: deckhand/CertificateKey/v1
        name: kubeadm-controller-manager
        path: .
      dest:
        path: .values.certs.controller_manager.key
    - src:
        schema: deckhand/Certificate/v1
        name: kubeadm-scheduler
        path: .
      dest:
        path: .values.certs.scheduler.crt
    - src:
        schema: deckhand/CertificateKey/v1
        name: kubeadm-scheduler
        path: .
      dest:
        path: .values.certs.scheduler.key

    # Cluster administrator.
    - src:
        schema: deckhand/Certificate/v1
        name: kubeadm-admin
        path: .
      dest:
        path: .values.certs.admin.crt
    - src:
        schema: deckhand/CertificateKey/v1
        name: kubeadm-admin
        path: .
      dest:
        path: .values.certs.admin.key

    # Front proxy
    - src:
        schema: deckhand/CertificateAuthority/v1
        name: kubeadm-front-proxy
        path: .
      dest:
        path: .values.certs.front_proxy_ca.crt
    - src:
        schema: deckhand/CertificateAuthorityKey/v1
        name: kubeadm-front-proxy
        path: .
      dest:
        path: .values.certs.front_proxy_ca.key
    - src:
        schema: deckhand/Certificate/v1
        name: kubeadm-front-proxy-client
        path: .
      dest:
        path: .values.certs.front_proxy_client.crt
    - src:
        schema: deckhand/CertificateKey/v1
        name: kubeadm-front-proxy-client
        path: .
      dest:
        path: .values.certs.front_proxy_client.key

    # Etcd
    - src:
        schema: deckhand/CertificateAuthority/v1
        name: kubeadm-etcd
        path: .
      dest:
        path: .values.certs.etcd_ca.crt
    - src:
        schema: deckhand/CertificateAuthority/v1
        name: kubeadm-etcd-peer
        path: .
      dest:
        path: .values.certs.etcd_ca_peer.crt
    - src:
        schema: deckhand/Certificate/v1
        name: kubeadm-etcd-healthcheck-client
        path: .
      dest:
        path: .values.certs.etcd_healthcheck_client.crt
    - src:
        schema: deckhand/CertificateKey/v1
        name: kubeadm-etcd-healthcheck-client
        path: .
      dest:
        path: .values.certs.etcd_healthcheck_client.key

    # Service account signing key
    - src:
        schema: deckhand/PrivateKey/v1
        name: kubeadm-service-account
        path: .
      dest:
        path: .values.certs.sa.key
    - src:
        schema: deckhand/PublicKey/v1
        name: kubeadm-service-account
        path: .
      dest:
        path: .values.certs.sa.pub

    # Per node certificates: airliner-control-1
    - src:
        schema: deckhand/Certificate/v1
        name: kubeadm-etcd-airliner-control-1
        path: .
      dest:
        path: .values.certs.nodes.airliner-control-1.etcd_server.crt
    - src:
        schema: deckhand/CertificateKey/v1
        name: kubeadm-etcd-airliner-control-1
        path: .
      dest:
        path: .values.certs.nodes.airliner-control-1.etcd_server.key
    - src:
        schema: deckhand/Certificate/v1
        name: kubeadm-etcd-airliner-control-1-peer
        path: .
      dest:
        path: .values.certs.nodes.airliner-control-1.etcd_peer.crt
    - src:
        schema: deckhand/CertificateKey/v1
        name: kubeadm-etcd-airliner-control-1-peer
        path: .
      dest:
        path: .values.certs.nodes.airliner-control-1.etcd_peer.key
    - src:
        schema: deckhand/Certificate/v1
        name: kubeadm-kubelet-airliner-control-1
        path: .
      dest:
        path: .values.certs.nodes.airliner-control-1.kubelet.crt
    - src:
        schema: deckhand/CertificateKey/v1
        name: kubeadm-kubelet-airliner-control-1
        path: .
      dest:
        path: .values.certs.nodes.airliner-control-1.kubelet.key
data:
  chart_name: kubeadm
  release: kubeadm
  namespace: kube-system
  # The release is ready when the anchor has applied the configuration on
  # every node (anchor pods become ready after that)
  wait:
    timeout: 3600
    resources:
      - type: daemonset
      - type: pod
    labels:
      release_group: airship-kubeadm
    native:
      enabled: false
  upgrade:
    no_hooks: false
  dependencies: []
  values:
    # Nodes of the site. Certificates of the PKI catalog are issued for these
    # names and IPs. Not used by the chart itself: gate scripts pass them to
    # the bootstrap script as NODE_NAME and NODE_IP. The first control plane
    # node runs kubeadm init.
    nodes:
      - name: airliner-control-1
        ip: 172.24.255.10
        role: control-plane

    kubelet:
      # Single node cluster: the anchor must not drain kubelet, it drains
      # the node first and there is no other node for the workloads.
      drain: false
      restart: false
      # used by the kubelet configuration below, changed by the gate to check
      # that the anchor applies kubelet configuration changes
      containerLogMaxFiles: 2

    kubeconfig:
      clusterName: kubernetes
      controlPlaneEndpoint: 127.0.0.1:6443

    kubeadm:
      fs:
        "ClusterConfiguration": "templates/phases/snippets/kubeadm/ClusterConfiguration"
        "init_config.yaml": "templates/phases/snippets/kubeadm/init_config.yaml"
        # used by the anchor (day 2): kubeadm upgrade node
        "upgrade_config.yaml": "templates/phases/snippets/kubeadm/upgrade_config.yaml"

    bundle:
      tpl:
        "templates/phases/snippets/kubeadm/ClusterConfiguration": |
          apiVersion: kubeadm.k8s.io/v1beta4
          kind: ClusterConfiguration
          kubernetesVersion: {{ .Values.cluster_config.kubernetesVersion }}
          clusterName: {{ .Values.kubeconfig.clusterName }}
          controlPlaneEndpoint: {{ .Values.kubeconfig.controlPlaneEndpoint }}
          certificatesDir: /etc/kubernetes/pki
          imageRepository: registry.k8s.io
          encryptionAlgorithm: RSA-2048
          networking:
            dnsDomain: {{ .Values.network.dns.cluster_domain }}
            podSubnet: {{ .Values.network.kubernetes.pod_cidr }}
            serviceSubnet: {{ .Values.network.kubernetes.service_cidr }}
          apiServer:
            extraArgs:
              - name: service-node-port-range
                value: {{ .Values.network.kubernetes.service_node_port_range | quote }}
              - name: tls-min-version
                value: VersionTLS12
          controllerManager:
            extraArgs:
              - name: terminated-pod-gc-threshold
                value: "1000"
          scheduler:
            # scheduler.conf delivered by the chart references the client
            # certificate in /etc/kubernetes/pki
            extraVolumes:
              - name: pki-certs
                hostPath: /etc/kubernetes/pki
                mountPath: /etc/kubernetes/pki
                readOnly: true
                pathType: Directory
          etcd:
            local:
              dataDir: /var/lib/etcd
              extraArgs:
                # peer certificates are issued by a dedicated CA
                - name: peer-trusted-ca-file
                  value: /etc/kubernetes/pki/etcd/ca-peer.crt
        "templates/phases/snippets/kubeadm/init_config.yaml": |
          apiVersion: kubeadm.k8s.io/v1beta4
          kind: InitConfiguration
          localAPIEndpoint:
            advertiseAddress: "${NODE_IP}"
            bindPort: 6443
          nodeRegistration:
            name: "${NODE_NAME}"
            criSocket: unix:///run/containerd/containerd.sock
            imagePullPolicy: IfNotPresent
            # single node cluster: workloads run on the control plane node
            taints: []
            ignorePreflightErrors:
              # kubelet is started by the bootstrap script before kubeadm
              - Port-10250
              # the bootstrap script delivers static pods and kubeconfigs
              - DirAvailable--etc-kubernetes-manifests
              - FileAvailable--etc-kubernetes-kubelet.conf
          skipPhases:
            # certificates and kubeconfigs are delivered by the bootstrap script
            - certs
            - kubeconfig
            # kubelet configuration is delivered and kubelet is (re)started
            # by the bootstrap script
            - kubelet-start
            - kubelet-finalize
          timeouts:
            controlPlaneComponentHealthCheck: 5m0s
            kubeletHealthCheck: 5m0s
            # wait-control-plane starts with bootstrapping the admin client
            # which polls the apiserver before waiting for the control plane
            kubernetesAPICall: 3m0s
        "templates/phases/snippets/kubeadm/upgrade_config.yaml": |
          apiVersion: kubeadm.k8s.io/v1beta4
          kind: UpgradeConfiguration
          node:
            # PKI is generated for the site and delivered by the chart
            certificateRenewal: false
            etcdUpgrade: true
            imagePullPolicy: IfNotPresent
            ignorePreflightErrors:
              - SystemVerification
              - CoreDNSUnsupportedPlugins
              - CoreDNSMigration
            skipPhases:
              # kubelet configuration is delivered by the chart
              - kubelet-config
              - addon
          # Must match the init configuration: static pod startup probes are
          # derived from controlPlaneComponentHealthCheck, a different value
          # changes the manifests and restarts the control plane.
          timeouts:
            controlPlaneComponentHealthCheck: 5m0s
            kubeletHealthCheck: 5m0s
            kubernetesAPICall: 3m0s
        "templates/phases/snippets/kubelet/_kubelet-config.yaml": |
          apiVersion: kubelet.config.k8s.io/v1beta1
          kind: KubeletConfiguration
          authentication:
            anonymous:
              enabled: false
            webhook:
              enabled: true
            x509:
              clientCAFile: /etc/kubernetes/pki/kubelet-client-ca.pem
          authorization:
            mode: Webhook
          cgroupDriver: systemd
          clusterDNS:
            - {{ .Values.network.dns.service_ip }}
          clusterDomain: {{ .Values.network.dns.cluster_domain }}
          containerRuntimeEndpoint: unix:///run/containerd/containerd.sock
          staticPodPath: /etc/kubernetes/manifests
          tlsCertFile: /etc/kubernetes/pki/kubelet.pem
          tlsPrivateKeyFile: /etc/kubernetes/pki/kubelet-key.pem
          rotateCertificates: false
          readOnlyPort: 0
          containerLogMaxFiles: {{ .Values.kubelet.containerLogMaxFiles }}
...
