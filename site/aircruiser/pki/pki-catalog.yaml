---
# The purpose of this file is to define the PKI certificates for the
# kubeadm chart based (day 0) Kubernetes cluster of the aircruiser site:
# 3 control plane nodes (stacked etcd) and 2 workers.
#
# Certificates are generated by Pegleg:
#   PL_SITE=aircruiser ./tools/deployment/aircat/010-generate-secrets.sh
#
# Node names and IPs are fixed so all certificates can be generated in
# advance: the IPs are configured on an overlay network by the gate. They
# must match the "nodes" values of the kubeadm chart document.
#
# All documents are prefixed with "kubeadm-" to avoid collisions with the
# promenade PKI documents of the skiff type.
#
schema: promenade/PKICatalog/v1
metadata:
  schema: metadata/Document/v1
  name: cluster-certificates
  layeringDefinition:
    abstract: false
    layer: site
  storagePolicy: cleartext
data:
  certificate_authorities:
    kubeadm-kubernetes:
      description: CA for Kubernetes components
      certificates:
        - document_name: kubeadm-apiserver
          description: Service certificate for Kubernetes apiserver
          common_name: kube-apiserver
          hosts:
            - aircruiser-control-1
            - aircruiser-control-2
            - aircruiser-control-3
            - 10.248.0.11
            - 10.248.0.12
            - 10.248.0.13
            - localhost
            - 127.0.0.1
            # FIXME: Repetition of api_service_ip in common-addresses; use
            # substitution
            - 10.96.0.1
          kubernetes_service_names:
            - kubernetes.default.svc.cluster.local
        - document_name: kubeadm-apiserver-kubelet-client
          description: Client certificate for the apiserver to connect to kubelets
          common_name: kube-apiserver-kubelet-client
          groups:
            - system:masters
        # Client and serving certificates for kubelets
        - document_name: kubeadm-kubelet-aircruiser-control-1
          common_name: system:node:aircruiser-control-1
          hosts:
            - aircruiser-control-1
            - 10.248.0.11
          groups:
            - system:nodes
        - document_name: kubeadm-kubelet-aircruiser-control-2
          common_name: system:node:aircruiser-control-2
          hosts:
            - aircruiser-control-2
            - 10.248.0.12
          groups:
            - system:nodes
        - document_name: kubeadm-kubelet-aircruiser-control-3
          common_name: system:node:aircruiser-control-3
          hosts:
            - aircruiser-control-3
            - 10.248.0.13
          groups:
            - system:nodes
        - document_name: kubeadm-kubelet-aircruiser-worker-1
          common_name: system:node:aircruiser-worker-1
          hosts:
            - aircruiser-worker-1
            - 10.248.0.21
          groups:
            - system:nodes
        - document_name: kubeadm-kubelet-aircruiser-worker-2
          common_name: system:node:aircruiser-worker-2
          hosts:
            - aircruiser-worker-2
            - 10.248.0.22
          groups:
            - system:nodes
        - document_name: kubeadm-scheduler
          description: Client certificate for Kubernetes scheduler
          common_name: system:kube-scheduler
        - document_name: kubeadm-controller-manager
          description: Client certificate for Kubernetes controller-manager
          common_name: system:kube-controller-manager
        - document_name: kubeadm-admin
          description: Client certificate for cluster administrator
          common_name: admin
          groups:
            - system:masters
    kubeadm-front-proxy:
      description: CA for the Kubernetes front proxy (aggregation layer)
      certificates:
        - document_name: kubeadm-front-proxy-client
          description: Client certificate for the apiserver to talk to aggregated apiservers
          common_name: front-proxy-client
    kubeadm-etcd:
      description: Certificates for Kubernetes's etcd servers
      certificates:
        - document_name: kubeadm-apiserver-etcd
          description: etcd client certificate for use by Kubernetes apiserver
          common_name: kube-apiserver-etcd-client
        - document_name: kubeadm-etcd-healthcheck-client
          description: etcd client certificate for health checks
          common_name: kube-etcd-healthcheck-client
        # etcd server certificates of control plane nodes
        - document_name: kubeadm-etcd-aircruiser-control-1
          common_name: aircruiser-control-1
          hosts:
            - aircruiser-control-1
            - 10.248.0.11
            - localhost
            - 127.0.0.1
        - document_name: kubeadm-etcd-aircruiser-control-2
          common_name: aircruiser-control-2
          hosts:
            - aircruiser-control-2
            - 10.248.0.12
            - localhost
            - 127.0.0.1
        - document_name: kubeadm-etcd-aircruiser-control-3
          common_name: aircruiser-control-3
          hosts:
            - aircruiser-control-3
            - 10.248.0.13
            - localhost
            - 127.0.0.1
    kubeadm-etcd-peer:
      description: Certificates for Kubernetes's etcd peers
      certificates:
        - document_name: kubeadm-etcd-aircruiser-control-1-peer
          common_name: aircruiser-control-1
          hosts:
            - aircruiser-control-1
            - 10.248.0.11
            - localhost
            - 127.0.0.1
        - document_name: kubeadm-etcd-aircruiser-control-2-peer
          common_name: aircruiser-control-2
          hosts:
            - aircruiser-control-2
            - 10.248.0.12
            - localhost
            - 127.0.0.1
        - document_name: kubeadm-etcd-aircruiser-control-3-peer
          common_name: aircruiser-control-3
          hosts:
            - aircruiser-control-3
            - 10.248.0.13
            - localhost
            - 127.0.0.1
  keypairs:
    - name: kubeadm-service-account
      description: Service account signing key for use by Kubernetes controller-manager.
...
