---
schema: armada/Chart/v1
metadata:
  schema: metadata/Document/v1
  name: ucp-maas
  replacement: true
  layeringDefinition:
    abstract: false
    layer: site
    parentSelector:
      name: ucp-maas-global
    actions:
      - method: merge
        path: .
  storagePolicy: cleartext
  substitutions:
    - src:
        schema: deckhand/CertificateKey/v1
        name: airship_drydock_kvm_ssh_key
        path: .
      dest:
        path: .values.conf.ssh.private_key
    - src:
        schema: pegleg/CommonAddresses/v1
        name: common-addresses
        path: .vip.maas_vip
      dest:
        path: .values.network.maas_ingress.addr
data:
  values:
    endpoints:
      maas_ingress:
        hosts:
          default: maas-ingress
          error_pages: maas-ingress-error
        host_fqdn_override:
          public: null
        port:
          http:
            default: 8081
          https:
            default: 8443
          ingress_default_server:
            default: 8383
          error_pages:
            default: 8080
            podport: 8080
          healthz:
            podport: 10283
          status:
            podport: 18089
          stream:
            podport: 18090
          profiler:
            podport: 18088
      maas_region:
        name: maas-region
        hosts:
          default: maas-region
        path:
          default: /MAAS
        scheme:
          default: 'http'
        port:
          region_api:
            default: 83
            nodeport: 31900
            podport: 5240
            public: 83
          region_proxy:
            default: 8000
        host_fqdn_override:
          default: null
...
